# Slug is a public URL (/games/submarine-combat) — never change it once live.
name: Submarine Combat
slug: submarine-combat
description: Place your submarines on the grid, then fire coordinates every round. Your
  shot hits every opponent hiding a ship there. Last fleet standing wins!
tagline: Like the classic board game, but everyone plays at once and every shot hits all opponents.
category: strategy
min_players: 2
max_players: 10
players_note: >-
  You need at least 2 fleets. With 4 or more it gets wild, because each shot checks every
  opponent's grid at once.
duration_minutes: 15
age: 8
long_description: >-
  The classic hide-and-seek at sea, rebuilt for a group. Everyone hides their submarines on a
  secret grid on their phone. Then, every round, each player picks one coordinate to fire at, and
  that shot checks every opponent's grid at once. A hit scores a point, sinking a whole submarine
  feels great, and a player whose whole fleet is sunk is out. The last fleet still afloat wins.
how_to_play:
  - The host picks the grid size (6×6, 8×8 or 10×10) and how many submarines each player gets.
  - Your phone places your fleet at random. Tap a submarine to move it, rotate it or shuffle them all, then confirm.
  - Every round you have 20 seconds to pick one coordinate to fire at.
  - Your shot is checked against every opponent's grid. Each hit scores 1 point.
  - When all of a player's submarines are sunk, they're out. The last fleet still afloat wins.
tips:
  - The host screen shows where everyone has already fired, so don't waste a shot on an empty spot.
  - After a hit, aim at the cells next to it. Submarines are in a straight line.
  - Spread your first shots out like a checkerboard. It finds big submarines faster.
  - Move your fleet away from the middle. Everyone aims there first.
  - Bigger grid + more submarines = a longer, more tactical game.
perfect_for: [party, family, work, video_call]
faq:
  - q: How is this different from the classic Battleship board game?
    a: Everyone plays at the same time, and each shot is checked against every opponent's grid at once, so you can hit several players with one shot.
  - q: How many players can play Submarine Combat?
    a: At least 2. There's no strict limit, and it gets more chaotic and more fun with 4 or more.
  - q: Can we play Submarine Combat over a video call?
    a: Yes. Each round gives you 20 seconds to choose, so a small video delay doesn't matter.

# Spanish. Same fields as above; anything missing falls back to English.
translations:
  es:
    name: Combate de Submarinos
    description: Coloca tus submarinos en la cuadrícula y dispara a una coordenada cada ronda. Tu
      disparo alcanza a todos los rivales que tengan un barco ahí. ¡Gana la última flota a flote!
    tagline: Como el clásico juego de mesa, pero todos juegan a la vez y cada disparo alcanza a todos los rivales.
    players_note: >-
      Se necesitan al menos 2 flotas. Con 4 o más se pone salvaje, porque cada disparo revisa la
      cuadrícula de todos los rivales a la vez.
    long_description: >-
      El clásico juego de esconderse en el mar, rehecho para grupos. Cada uno esconde sus submarinos
      en una cuadrícula secreta en su celular. Luego, en cada ronda, cada jugador elige una coordenada
      para disparar, y ese disparo revisa la cuadrícula de todos los rivales a la vez. Un impacto
      suma un punto, hundir un submarino completo se siente genial, y el jugador que pierde toda su
      flota queda eliminado. Gana la última flota que siga a flote.
    how_to_play:
      - El anfitrión elige el tamaño de la cuadrícula (6×6, 8×8 o 10×10) y cuántos submarinos tiene cada jugador.
      - Tu celular coloca tu flota al azar. Toca un submarino para moverlo, girarlo o mezclarlos todos, y luego confirma.
      - En cada ronda tienes 20 segundos para elegir una coordenada a la que disparar.
      - Tu disparo se revisa en la cuadrícula de cada rival. Cada impacto suma 1 punto.
      - Cuando todos los submarinos de un jugador se hunden, queda eliminado. Gana la última flota a flote.
    tips:
      - La pantalla principal muestra dónde ya han disparado todos, así que no desperdicies un disparo en una casilla vacía.
      - Después de un impacto, apunta a las casillas de al lado. Los submarinos están en línea recta.
      - Reparte tus primeros disparos como un tablero de ajedrez. Así encuentras antes los submarinos grandes.
      - Aleja tu flota del centro. Todos apuntan ahí primero.
      - Cuadrícula más grande + más submarinos = una partida más larga y más táctica.
    faq:
      - q: ¿En qué se diferencia del clásico juego de mesa Batalla Naval?
        a: Todos juegan al mismo tiempo, y cada disparo se revisa en la cuadrícula de todos los rivales a la vez, así que puedes alcanzar a varios jugadores con un solo disparo.
      - q: ¿Cuántos jugadores pueden jugar Combate de Submarinos?
        a: Al menos 2. No hay un límite estricto, y con 4 o más es más caótico y más divertido.
      - q: ¿Se puede jugar Combate de Submarinos por videollamada?
        a: Sí. Cada ronda te da 20 segundos para elegir, así que un pequeño retraso en el video no importa.
