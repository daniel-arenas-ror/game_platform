# Slug is a public URL (/games/matching-pairs) — never change it once live.
name: Matching Pairs
slug: matching-pairs
description: Memorize the board on the big screen, then find every matching pair on your
  phone before time runs out. Each match scores, every wrong pair costs a few points!
tagline: Look closely. In a few seconds, every card flips face down.
category: memory
min_players: 1
max_players: 30
players_note: >-
  Everyone plays their own board on their own phone at the same time, so it works for any group
  size, from a solo practice to a full classroom.
duration_minutes: 5
age: 5
long_description: >-
  The classic memory card game, played by everyone at once. The big screen shows the whole board
  face up for a few seconds. Then the cards flip over, and everyone has to find the pairs on their
  own phone, using only what they remember. Each match scores 100 points, but every wrong pair
  costs 10, so guessing has a price. Pick animals, objects, flags, numbers or a random mix.
how_to_play:
  - The host picks the board size (4×4 up to 6×6), the card set, the time per round and the number of rounds.
  - The whole board appears face up on the big screen for 8 to 20 seconds, depending on its size. Memorize it!
  - The cards flip over. Tap two cards on your phone to turn them face up.
  - A match scores 100 points and stays open. A wrong pair costs 10 points and flips back.
  - Clear your board before the timer runs out. The highest score wins.
tips:
  - Don't try to remember everything. Pick one row or one corner and remember it well.
  - Say the pairs in your head, like "dog top left, dog bottom right".
  - Wrong guesses cost points, so if you have no idea, tap a card you remember first.
  - A wrong pair still tells you two cards. Use that for your next turn.
  - Start with 4×4 to warm up. 6×6 with flags is a real challenge.
perfect_for: [classroom, family, party]
faq:
  - q: How is Matching Pairs scored?
    a: Each match is worth 100 points and each wrong pair costs 10 points. Your score never drops below 0.
  - q: What cards can we play with?
    a: Animals, objects, country flags, numbers, or a random mix.
  - q: Is Matching Pairs good for young kids?
    a: Yes. A 4×4 board with animals is perfect for little ones, and bigger boards challenge older players.

# Spanish. Same fields as above; anything missing falls back to English.
translations:
  es:
    name: Encuentra las Parejas
    description: Memoriza el tablero en la pantalla grande y luego encuentra todas las parejas en
      tu celular antes de que se acabe el tiempo. ¡Cada pareja suma, cada error resta unos puntos!
    tagline: Mira bien. En unos segundos todas las cartas se voltean.
    players_note: >-
      Cada uno juega su propio tablero en su celular al mismo tiempo, así que funciona con
      cualquier tamaño de grupo, desde una práctica en solitario hasta un salón completo.
    long_description: >-
      El clásico juego de memoria con cartas, jugado por todos a la vez. La pantalla grande muestra
      todo el tablero boca arriba durante unos segundos. Luego las cartas se voltean y cada uno tiene
      que encontrar las parejas en su propio celular, usando solo lo que recuerda. Cada pareja suma
      100 puntos, pero cada error resta 10, así que adivinar tiene un precio. Elige animales,
      objetos, banderas, números o una mezcla al azar.
    how_to_play:
      - El anfitrión elige el tamaño del tablero (de 4×4 a 6×6), el tipo de cartas, el tiempo por ronda y el número de rondas.
      - Todo el tablero aparece boca arriba en la pantalla grande durante 8 a 20 segundos, según su tamaño. ¡Memorízalo!
      - Las cartas se voltean. Toca dos cartas en tu celular para destaparlas.
      - Una pareja suma 100 puntos y queda abierta. Un error resta 10 puntos y las cartas se vuelven a voltear.
      - Despeja tu tablero antes de que se acabe el tiempo. Gana el puntaje más alto.
    tips:
      - No intentes recordarlo todo. Elige una fila o una esquina y recuérdala bien.
      - Di las parejas en tu cabeza, como "perro arriba a la izquierda, perro abajo a la derecha".
      - Los errores restan puntos, así que si no tienes idea, toca primero una carta que sí recuerdes.
      - Un error igual te muestra dos cartas. Úsalo en tu siguiente turno.
      - Empiecen con 4×4 para calentar. 6×6 con banderas es un verdadero reto.
    faq:
      - q: ¿Cómo se puntúa Encuentra las Parejas?
        a: Cada pareja vale 100 puntos y cada error resta 10. Tu puntaje nunca baja de 0.
      - q: ¿Con qué cartas se puede jugar?
        a: Animales, objetos, banderas de países, números o una mezcla al azar.
      - q: ¿Encuentra las Parejas es bueno para niños pequeños?
        a: Sí. Un tablero de 4×4 con animales es perfecto para los más pequeños, y los tableros grandes retan a los mayores.
