# Slug is a public URL (/games/doodle-dash) — never change it once live.
name: Doodle Dash
slug: doodle-dash
description: One player draws a secret word on their phone, the drawing appears live on the
  big screen, and everyone races to guess it. The faster you guess, the more you score!
tagline: You draw a cat. Everyone guesses "potato". Classic.
category: drawing
min_players: 2
max_players: 12
players_note: >-
  You need one artist and at least one guesser, so 2 players can play. With 3 to 8 it's at its
  best: plenty of wild guesses, and everyone gets a turn to draw.
duration_minutes: 10
age: 7
long_description: >-
  A drawing and guessing race for the whole room. Each turn, one player picks a secret word on their
  phone and draws it with a finger, and every line appears live on the big screen. Everyone else types
  their guesses on their phone. The faster you guess, the more points you get, and the artist scores
  for every player who gets it, so drawing well pays off too. Letters of the word appear as hints when
  time runs low, and the wrong guesses on the TV are often the funniest part.
how_to_play:
  - The host picks the drawing time, how many times each player draws, and the word difficulty.
  - On your turn, pick one of three secret words on your phone, then draw it with your finger. Your drawing appears live on the big screen.
  - Everyone else watches the TV and types guesses on their phone. If you're one letter off, your phone says "So close!"
  - A correct guess scores 50 to 100 points, depending on how fast you were. The artist scores 25 for every player who gets it.
  - Letters of the word appear on the TV as hints. When everyone has drawn, the highest score wins.
tips:
  - "Artists: start with the big shape, then add the details. A circle and two ears is already a cat."
  - "No letters or numbers in your drawing. Draw it, don't write it!"
  - "Guessers: guess early and often. Wrong guesses cost nothing."
  - Watch the hint letters. Knowing the word has two parts or starts with a "p" helps a lot.
  - Short on time? Pick the easy word. A quick guess is worth more than a perfect drawing.
perfect_for: [party, family, classroom, work]
faq:
  - q: Do guessers see the drawing on their phone?
    a: No. The drawing appears on the big screen, and the phones are only for typing guesses. Everyone looks up at the TV together.
  - q: Can someone write the answer instead of drawing it?
    a: The game can't stop it, but it's against the spirit of the game. Words and letters in the drawing are the one house rule.
  - q: Can I hide wrong guesses from the TV?
    a: Yes. The host can turn the guess feed off in the room settings. When it's on, rude words are hidden automatically.

# Spanish. Same fields as above; anything missing falls back to English.
translations:
  es:
    name: Dibuja y Adivina
    description: Un jugador dibuja una palabra secreta en su celular, el dibujo aparece en vivo en
      la pantalla grande y todos compiten por adivinarla. ¡Cuanto más rápido adivines, más puntos!
    tagline: Dibujas un gato. Todos dicen "papa". Clásico.
    players_note: >-
      Se necesita un artista y al menos un adivinador, así que se puede jugar con 2. De 3 a 8 es
      cuando mejor funciona: muchas respuestas locas, y todos tienen su turno para dibujar.
    long_description: >-
      Una carrera de dibujar y adivinar para toda la sala. En cada turno, un jugador elige una
      palabra secreta en su celular y la dibuja con el dedo, y cada trazo aparece en vivo en la
      pantalla grande. Los demás escriben sus respuestas en su celular. Cuanto más rápido adivines,
      más puntos ganas, y el artista suma por cada jugador que acierta, así que dibujar bien también
      paga. Cuando queda poco tiempo aparecen letras de la palabra como pistas, y las respuestas
      equivocadas en la TV suelen ser lo más divertido.
    how_to_play:
      - El anfitrión elige el tiempo para dibujar, cuántas veces dibuja cada jugador y la dificultad de las palabras.
      - En tu turno, elige una de tres palabras secretas en tu celular y dibújala con el dedo. Tu dibujo aparece en vivo en la pantalla grande.
      - Los demás miran la TV y escriben sus respuestas en el celular. Si te falta una letra, tu celular dice "¡Casi!"
      - Una respuesta correcta suma de 50 a 100 puntos, según lo rápido que fuiste. El artista suma 25 por cada jugador que acierta.
      - Las letras de la palabra aparecen en la TV como pistas. Cuando todos hayan dibujado, gana el puntaje más alto.
    tips:
      - "Artistas: empiecen por la forma grande y luego añadan los detalles. Un círculo y dos orejas ya es un gato."
      - "Nada de letras ni números en el dibujo. ¡Dibújalo, no lo escribas!"
      - "Adivinadores: respondan pronto y seguido. Equivocarse no cuesta nada."
      - Fíjate en las letras de pista. Saber que la palabra tiene dos partes o empieza por "p" ayuda mucho.
      - ¿Poco tiempo? Elige la palabra fácil. Una respuesta rápida vale más que un dibujo perfecto.
    faq:
      - q: ¿Los adivinadores ven el dibujo en su celular?
        a: No. El dibujo aparece en la pantalla grande, y los celulares solo sirven para escribir respuestas. Todos miran la TV juntos.
      - q: ¿Alguien puede escribir la respuesta en vez de dibujarla?
        a: El juego no puede impedirlo, pero va contra el espíritu del juego. Nada de palabras ni letras en el dibujo es la única regla de la casa.
      - q: ¿Puedo ocultar las respuestas equivocadas de la TV?
        a: Sí. El anfitrión puede apagar las respuestas en pantalla en la configuración de la sala. Cuando están activadas, las palabras groseras se ocultan automáticamente.
