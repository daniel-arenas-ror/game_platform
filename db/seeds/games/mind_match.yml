# Slug is a public URL (/games/mind-match) — never change it once live.
name: Mind Match
slug: mind-match
description: The host shows a category. Everyone types one word — points for every player
  who thinks the same as you. The more minds you match, the higher your score!
tagline: Don't be original. Be predictable. Think like the group!
category: social
min_players: 3
max_players: 20
players_note: >-
  You score by matching other players, so you need at least 3. With 5 to 10 the reveal is at its
  best, with big groups of the same word and one lonely answer nobody expected.
duration_minutes: 5
age: 8
long_description: >-
  The host screen shows a category like "Things you find at the beach" or "Famous duos". Everyone
  secretly types one word on their phone. Then the answers are revealed, and you score one point for
  every player, you included, who wrote the same word. The goal is not to be clever. It's to guess
  what everyone else will think. Expect cheering when five people all write "sand", and groans for
  the one person who wrote "jellyfish".
how_to_play:
  - The host picks the number of rounds and how many seconds everyone gets to type.
  - A category appears on the big screen, like "Things that are yellow".
  - Type one word on your phone before time runs out. No talking!
  - Answers are grouped. If 4 people wrote the same word, each of them gets 4 points.
  - A new category each round. The highest total at the end wins.
tips:
  - Go for the first, most obvious word. That's what everyone else is thinking too.
  - Think about who's in the room. A group of kids and a group of chefs will answer "Things in a kitchen" differently.
  - Plurals are matched for you, so "cats" and "cat" count as the same word.
  - Keep it to one simple word. "Banana" will match far more people than "ripe banana".
  - Try it as an icebreaker at work. You'll learn a lot about how your team thinks.
perfect_for: [party, work, family, classroom, video_call]
faq:
  - q: How does scoring work in Mind Match?
    a: Every player in a group of matching words scores the size of the group. If 3 people wrote "sand", each of them gets 3 points.
  - q: Does spelling matter?
    a: Answers are compared without caps, extra spaces or punctuation, and common plurals are folded, so "Cats" and "cat" match.
  - q: Can we play Mind Match over a video call?
    a: Yes. You have 10 to 20 seconds to type each word, so it plays great on Zoom, Meet or Teams.

# Spanish. Same fields as above; anything missing falls back to English.
translations:
  es:
    name: Mentes Gemelas
    description: La pantalla muestra una categoría. Todos escriben una palabra — ganas puntos por
      cada jugador que piense lo mismo que tú. ¡Cuantas más mentes coincidan, más puntos!
    tagline: No seas original. Sé predecible. ¡Piensa como el grupo!
    players_note: >-
      Sumas puntos al coincidir con otros jugadores, así que se necesitan al menos 3. De 5 a 10 la
      revelación es lo mejor, con grandes grupos de la misma palabra y una respuesta solitaria que
      nadie esperaba.
    long_description: >-
      La pantalla principal muestra una categoría como "Cosas que encuentras en la playa" o "Dúos
      famosos". Cada uno escribe en secreto una palabra en su celular. Luego se revelan las
      respuestas y ganas un punto por cada jugador, tú incluido, que escribió la misma palabra. El
      objetivo no es ser ingenioso. Es adivinar lo que pensarán los demás. Habrá gritos de alegría
      cuando cinco personas escriban "arena", y quejas para el único que escribió "medusa".
    how_to_play:
      - El anfitrión elige el número de rondas y cuántos segundos tienen todos para escribir.
      - Aparece una categoría en la pantalla grande, como "Cosas que son amarillas".
      - Escribe una palabra en tu celular antes de que se acabe el tiempo. ¡Sin hablar!
      - Las respuestas se agrupan. Si 4 personas escribieron la misma palabra, cada una gana 4 puntos.
      - Una categoría nueva en cada ronda. Gana el total más alto al final.
    tips:
      - Ve por la primera palabra, la más obvia. Es lo que todos los demás también están pensando.
      - Piensa en quién está en la sala. Un grupo de niños y uno de chefs responderán distinto a "Cosas de la cocina".
      - Los plurales y las tildes se juntan solos, así que "gatos" y "gato", o "camión" y "camion", cuentan como la misma palabra.
      - Usa una sola palabra sencilla. "Banano" coincidirá con mucha más gente que "banano maduro".
      - Pruébalo para romper el hielo en el trabajo. Aprenderás mucho sobre cómo piensa tu equipo.
    faq:
      - q: ¿Cómo se puntúa Mentes Gemelas?
        a: Cada jugador de un grupo de palabras iguales gana tantos puntos como personas haya en el grupo. Si 3 personas escribieron "arena", cada una gana 3 puntos.
      - q: ¿Importa la ortografía?
        a: Las respuestas se comparan sin tener en cuenta mayúsculas, tildes, espacios de más ni signos de puntuación, y los plurales se juntan, así que "Gatos" y "gato" coinciden.
      - q: ¿Se puede jugar Mentes Gemelas por videollamada?
        a: Sí. Tienes de 10 a 20 segundos para escribir cada palabra, así que funciona muy bien en Zoom, Meet o Teams.
