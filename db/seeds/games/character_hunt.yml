name: Character Hunt
slug: character-hunt
# Hidden on the public site until the game has its images (instructions.png, WebP copies, og.png).
listed: false
description: A seek-and-find race. The big screen shows a crowded park, beach or square and the
  person to find. Everyone searches the same scene on their phone, and the first three to tap them score.
tagline: One person in a crowd of 150. Find them before your friends do.
category: perception
min_players: 1
max_players: 12
players_note: >-
  You can search alone to practise, but it's a race: with 3 or more players, the first three to find
  the person score 3, 2 and 1 points, and everyone else is still hunting when the round ends.
duration_minutes: 10
age: 6
long_description: >-
  Character Hunt is a hidden-person race for the big screen. Each round the TV shows a new busy
  scene, a park, a beach or a town square, packed with up to 150 people, and the one person you have
  to find. Every phone gets the same scene: pinch to zoom in, drag around, and tap the person when you
  spot them. The first to find them scores 3 points, the second 2 and the third 1, and then the round
  ends. Careful with lucky guesses: tap the wrong person and your phone freezes for 3 seconds. Watch
  out for lookalikes too, people dressed almost the same with just a different hat or no glasses. At
  the end of each round the big screen zooms in on where the person was hiding.
how_to_play:
  - "The host picks the difficulty (60, 100 or 150 people, with up to 4 lookalikes), the number of rounds and the time to search."
  - Each round starts with the person to find, on the big screen and on every phone. Remember their clothes, hat and glasses.
  - Then the scene appears on your phone. Pinch to zoom, drag to look around, and tap the person when you find them.
  - The first three to find them score 3, 2 and 1 points. A wrong tap freezes your phone for 3 seconds.
  - The round ends when three players have found the person or time runs out. The big screen shows where they were, and the next round starts in a new place.
tips:
  - Look for one thing that stands out, like a striped top or a balloon, and scan the scene for that first.
  - Check every detail before you tap. Lookalikes wear the same clothes with one small difference.
  - The big screen shows the whole scene too. A quick look at it can tell you which part to zoom into.
  - Search in strips, left to right, so you don't look at the same corner twice.
  - People at the back are smaller. Zoom in further when you search near the top of the scene.
perfect_for: [party, family, classroom, work]
faq:
  - q: How do you score in Character Hunt?
    a: The first player to tap the right person scores 3 points, the second 2 and the third 1. The round ends when three players have found them, so speed matters.
  - q: What happens if you tap the wrong person?
    a: Your phone freezes for 3 seconds. You can still move around the scene, but you can't tap anyone until it thaws. Tapping empty ground doesn't count as a mistake.
  - q: What are lookalikes?
    a: On Normal and Hard, the crowd hides 2 or 4 people dressed almost like the person you're looking for, with one or two things changed, like a different hat colour or no glasses.
  - q: Is the crowd the same on every phone?
    a: Yes. The big screen and every phone show exactly the same scene, so it's a fair race. Each round has a new crowd and a new person to find.

# Spanish. Same fields as above; anything missing falls back to English.
translations:
  es:
    name: Busca al Personaje
    description: Una carrera para encontrar a alguien entre la multitud. La pantalla grande muestra
      un parque, una playa o una plaza llenos de gente y a la persona que hay que buscar. Todos buscan
      en la misma escena en su celular, y los tres primeros en tocarla suman puntos.
    tagline: Una persona entre 150. Encuéntrala antes que tus amigos.
    players_note: >-
      Puedes buscar solo para practicar, pero es una carrera: con 3 o más jugadores, los tres primeros
      en encontrar a la persona suman 3, 2 y 1 puntos, y los demás siguen buscando cuando termina la ronda.
    long_description: >-
      Busca al Personaje es una carrera para encontrar a alguien escondido, hecha para la pantalla
      grande. En cada ronda la TV muestra una escena nueva, un parque, una playa o una plaza, con hasta
      150 personas, y a la persona que hay que encontrar. Cada celular recibe la misma escena: pellizca
      para acercar, arrastra para moverte y tócala cuando la veas. El primero en encontrarla suma 3
      puntos, el segundo 2 y el tercero 1, y ahí termina la ronda. Cuidado con tocar al azar: si tocas a
      la persona equivocada, tu celular se congela 3 segundos. Y ojo con los parecidos, gente vestida casi
      igual pero con otro sombrero o sin lentes. Al final de cada ronda la pantalla grande se acerca a
      donde estaba escondida.
    how_to_play:
      - "El anfitrión elige la dificultad (60, 100 o 150 personas, con hasta 4 parecidos), el número de rondas y el tiempo para buscar."
      - Cada ronda empieza mostrando a la persona que hay que encontrar, en la pantalla grande y en cada celular. Recuerda su ropa, su sombrero y sus lentes.
      - Luego aparece la escena en tu celular. Pellizca para acercar, arrastra para moverte y tócala cuando la encuentres.
      - Los tres primeros en encontrarla suman 3, 2 y 1 puntos. Si tocas a la persona equivocada, tu celular se congela 3 segundos.
      - La ronda termina cuando tres jugadores la encontraron o se acaba el tiempo. La pantalla grande muestra dónde estaba y la siguiente ronda empieza en otro lugar.
    tips:
      - Busca algo que llame la atención, como una camiseta a rayas o un globo, y recorre la escena buscando eso primero.
      - Revisa cada detalle antes de tocar. Los parecidos llevan la misma ropa con una pequeña diferencia.
      - La pantalla grande también muestra toda la escena. Una mirada rápida te dice dónde acercarte.
      - Busca por franjas, de izquierda a derecha, para no mirar dos veces el mismo rincón.
      - La gente del fondo se ve más pequeña. Acerca más cuando busques en la parte de arriba.
    faq:
      - q: ¿Cómo se suman puntos en Busca al Personaje?
        a: El primer jugador en tocar a la persona correcta suma 3 puntos, el segundo 2 y el tercero 1. La ronda termina cuando tres jugadores la encontraron, así que la rapidez cuenta.
      - q: ¿Qué pasa si tocas a la persona equivocada?
        a: Tu celular se congela 3 segundos. Puedes seguir moviéndote por la escena, pero no puedes tocar a nadie hasta que se descongele. Tocar el suelo vacío no cuenta como error.
      - q: ¿Qué son los parecidos?
        a: En Normal y Difícil, la multitud esconde a 2 o 4 personas vestidas casi igual que la que buscas, con una o dos cosas distintas, como otro color de sombrero o sin lentes.
      - q: ¿La multitud es la misma en todos los celulares?
        a: Sí. La pantalla grande y todos los celulares muestran exactamente la misma escena, así que la carrera es justa. Cada ronda trae una multitud nueva y otra persona que buscar.
