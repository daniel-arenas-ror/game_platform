# Slug is a public URL (/games/guess-the-color) — never change it once live.
name: Guess the Color
slug: guess-the-color
description: The host screen shows a color for 5 seconds. Match it on your phone with
  RGB sliders before time runs out!
tagline: You saw it for 5 seconds. Now mix it from memory.
category: perception
min_players: 1
max_players: 30
players_note: >-
  Everyone mixes their color at the same time, so any group size works. With 3 or more the
  reveal, where everyone's colors appear next to the real one, gets the biggest laughs.
duration_minutes: 5
age: 6
long_description: >-
  Think you have a good eye for color? The host screen flashes a color for 5 seconds, then it's
  gone. Everyone has 10 seconds to recreate it on their phone with red, green and blue sliders. The
  closer your mix, the more points you get, up to 1,000 per round. Then comes the reveal, with
  everyone's colors next to the real one, and that's where the laughing starts.
how_to_play:
  - The host picks the number of rounds and the difficulty. Easy uses bright, vivid colors. Hard can be any color at all.
  - A color fills the host screen for 5 seconds. Look closely and remember it.
  - The color disappears. You get 10 seconds to mix it on your phone with the red, green and blue sliders.
  - The closer your color is to the real one, the more points you get, up to 1,000 per round.
  - After each round, everyone's colors are shown next to the real one. The highest total after the last round wins.
tips:
  - Find the strongest channel first. Is it mostly red, green or blue? Set that slider, then adjust the others.
  - All three sliders high makes light colors. All three low makes dark ones.
  - Yellow is red plus green. Purple is red plus blue. Cyan is green plus blue.
  - Don't trust the screen's glow. Most colors look a little brighter on a TV than they really are.
  - Start with Easy and switch to Hard once everyone gets the hang of the sliders.
perfect_for: [family, classroom, party]
faq:
  - q: How is Guess the Color scored?
    a: Each round is worth up to 1,000 points. The closer your color is to the target, the more you get.
  - q: What's the difference between Easy and Hard?
    a: Easy uses 12 bright, fully saturated colors. Hard can be any color, including muddy and pastel tones.
  - q: Can we play Guess the Color over a video call?
    a: You can, but video calls change colors a little when they compress the screen. It's fairest in the same room as the TV.

# Spanish. Same fields as above; anything missing falls back to English.
translations:
  es:
    name: Adivina el Color
    description: La pantalla principal muestra un color durante 5 segundos. ¡Recréalo en tu
      celular con los controles RGB antes de que se acabe el tiempo!
    tagline: Lo viste 5 segundos. Ahora mézclalo de memoria.
    players_note: >-
      Todos mezclan su color al mismo tiempo, así que funciona con cualquier tamaño de grupo. Con 3
      o más, la revelación, donde los colores de todos aparecen junto al real, saca las mayores
      carcajadas.
    long_description: >-
      ¿Crees que tienes buen ojo para el color? La pantalla principal muestra un color durante 5
      segundos y luego desaparece. Todos tienen 10 segundos para recrearlo en su celular con los
      controles de rojo, verde y azul. Cuanto más se parezca tu mezcla, más puntos ganas, hasta
      1.000 por ronda. Luego viene la revelación, con los colores de todos junto al real, y ahí
      empiezan las risas.
    how_to_play:
      - El anfitrión elige el número de rondas y la dificultad. Fácil usa colores vivos y brillantes. Difícil puede ser cualquier color.
      - Un color llena la pantalla principal durante 5 segundos. Míralo bien y memorízalo.
      - El color desaparece. Tienes 10 segundos para mezclarlo en tu celular con los controles de rojo, verde y azul.
      - Cuanto más se parezca tu color al real, más puntos ganas, hasta 1.000 por ronda.
      - Después de cada ronda, los colores de todos se muestran junto al real. Gana el total más alto tras la última ronda.
    tips:
      - Encuentra primero el canal más fuerte. ¿Es sobre todo rojo, verde o azul? Ajusta ese control y luego los demás.
      - Los tres controles altos dan colores claros. Los tres bajos dan colores oscuros.
      - El amarillo es rojo más verde. El morado es rojo más azul. El cian es verde más azul.
      - No te fíes del brillo de la pantalla. La mayoría de colores se ven un poco más claros en una TV de lo que son.
      - Empiecen en Fácil y pasen a Difícil cuando todos le agarren el truco a los controles.
    faq:
      - q: ¿Cómo se puntúa Adivina el Color?
        a: Cada ronda vale hasta 1.000 puntos. Cuanto más se acerque tu color al objetivo, más ganas.
      - q: ¿Cuál es la diferencia entre Fácil y Difícil?
        a: Fácil usa 12 colores brillantes y saturados. Difícil puede ser cualquier color, incluidos tonos apagados y pastel.
      - q: ¿Se puede jugar Adivina el Color por videollamada?
        a: Se puede, pero las videollamadas cambian un poco los colores al comprimir la pantalla. Es más justo en la misma sala que la TV.
