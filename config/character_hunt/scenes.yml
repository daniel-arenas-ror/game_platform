# The places a round can happen in. Each is drawn in code (controllers/character_hunt/scene.js);
# this file says where people may stand and which theme the scene belongs to (the crowd dresses
# for it, see characters.yml). Coordinates are fractions of the scene (x of its width, y of its
# height); `ratio` is width / height.
#
# areas:  rectangles [x0, y0, x1, y1] where a character's feet may be
# holes:  rectangles inside the areas where nobody stands (a pond, a fountain)
# heights: a character's height (fraction of the scene height) at the top of the areas and at
#          the bottom of the scene: people further away are smaller
park:
  theme: classic
  ratio: 1.6
  areas: [[0.02, 0.30, 0.98, 0.99]]
  holes: [[0.58, 0.40, 0.84, 0.64]]
  heights: [0.065, 0.12]
