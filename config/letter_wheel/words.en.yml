# Letter Wheel clues for English rooms: a list per letter, one picked at random each game.
#   answer:   the word (it must start with the letter, or contain it with `contains: true`)
#   clue:     shown on the TV; never says the word, family-friendly (ages 8+)
#   also:     other answers that count (optional)
# Guesses are compared without accents, case, a leading "the/a/an" or a plural "s", and one typo is
# forgiven on words of 6+ letters. A test checks every letter has clues and every answer fits its letter.
a:
  - answer: apple
    clue: A crunchy red or green fruit that grows on trees
