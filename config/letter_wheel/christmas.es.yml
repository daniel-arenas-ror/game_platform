  - answer: "leña"
    clue: "Troncos para hacer fuego"
m:
  - answer: "muérdago"
    clue: "Planta de bayas blancas que se cuelga en las puertas"
  - answer: "mazapán"
    clue: "Dulce de almendra y azúcar típico de Navidad"
  - answer: "Melchor"
    clue: "Uno de los tres magos de Oriente, el de barba blanca"
n:
  - answer: "Nochebuena"
