  - answer: "gorro"
    clue: "Papá Noel lleva uno rojo con un pompón blanco"
h:
  - answer: "hielo"
    clue: "Agua congelada"
  - answer: "horno"
    clue: "Donde se asa la comida de Navidad"
  - answer: "hogar"
    clue: "La casa donde estás con los tuyos"
i:
  - answer: "iluminación"
    clue: "Todas las bombillas que adornan las calles en estas fiestas"
  - answer: "iglesia"
    clue: "Lugar donde se celebra la misa del gallo"
  - answer: "ilusión"
    clue: "Lo que sienten los niños esperando los regalos"
j:
  - answer: "jersey"
    also: ["suéter", "chompa"]
    clue: "Prenda de lana calentita, a veces con dibujos navideños"
  - answer: "José"
