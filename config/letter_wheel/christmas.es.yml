  - answer: "musgo"
    contains: true
    clue: "Planta suave y verde que crece en las piedras húmedas"
v:
  - answer: "villancico"
    clue: "Canción típica de Navidad"
  - answer: "vela"
    clue: "Da luz con una llama"
  - answer: "vacaciones"
    clue: "Días sin colegio por Navidad"
w:
  - answer: "Hollywood"
