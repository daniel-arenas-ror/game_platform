# Pistas de Navidad de Letter Wheel para salas en español (la opción Navidad del selector de palabras).
# Mismo formato y reglas que words.es.yml. Ninguna pista nombra otra respuesta de esta lista, y "Papá Noel"
# y "reno" nunca son respuestas, porque muchas pistas los mencionan.
a:
  - answer: "adviento"
    also: ["calendario de adviento"]
    clue: "Las cuatro semanas antes de Navidad"
  - answer: "ángel"
    clue: "Figura con alas que a veces se pone en lo alto del árbol"
  - answer: "aguinaldo"
    clue: "Regalo o propina que se da por Navidad"
b:
  - answer: "belén"
    also: ["pesebre", "nacimiento"]
    clue: "Figuras que representan el nacimiento de Jesús en un establo"
  - answer: "bola"
    also: ["bola de navidad"]
    clue: "Adorno redondo y brillante que cuelga del árbol"
  - answer: "bastón de caramelo"
    clue: "Dulce a rayas rojas y blancas con forma de gancho"
c:
  - answer: "chimenea"
    clue: "Por ella baja Papá Noel a las casas"
  - answer: "campana"
    clue: "Suena «din, don» cuando la mueves"
  - answer: "corona"
    clue: "Aro de ramas verdes que se cuelga en la puerta"
d:
  - answer: "diciembre"
    clue: "El mes de la Navidad"
  - answer: "decoración"
    also: ["decoraciones", "adornos"]
    clue: "Lo que pones por la casa para que parezca festiva"
  - answer: "deseo"
    clue: "Lo que pides al escribir la carta a los Reyes"
e:
  - answer: "elfo"
    also: ["duende"]
    clue: "Ayudante de Papá Noel en su taller"
  - answer: "escarcha"
    clue: "Capa fina y blanca que cubre la hierba en una mañana helada"
  - answer: "espumillón"
    clue: "Tira brillante de colores que se cuelga en el árbol"
f:
  - answer: "familia"
    clue: "Las personas que se reúnen en casa por Navidad"
  - answer: "feliz"
    also: ["feliz navidad"]
    clue: "___ Navidad: lo que se desea a todos"
  - answer: "frío"
    clue: "Lo que hace en invierno"
g:
  - answer: "galletas de jengibre"
    also: ["galleta de jengibre"]
    clue: "Galletas especiadas con forma de muñequito"
  - answer: "guirnalda"
