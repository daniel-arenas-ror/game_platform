  - answer: "pastores"
    also: ["pastor"]
    clue: "Cuidaban ovejas y fueron a ver al niño Jesús"
  - answer: "polvorón"
    also: ["polvorones"]
    clue: "Dulce que se deshace en la boca"
q:
  - answer: "esquí"
