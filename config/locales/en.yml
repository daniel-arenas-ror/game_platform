          headline: "A brain break that works."
          body: "Wake the class up between lessons. Every student plays at once from their phone, and the big screen keeps the whole room together."
        work:
          label: "Work teams"
          headline: "Warm up any meeting."
          body: "Start with five minutes of play. People loosen up, talk more and get to know each other — in the office or on a video call."
