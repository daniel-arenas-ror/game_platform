          body: "Players scan the QR code or type the room code, pick a nickname and they're in."
        - title: "Play together"
          body: "Trivia, social deduction, memory, color matching and more — %{count} games, everyone playing live."
      ready_title: "Ready when your group is."
      ready_text: "Open a room in a few seconds. No registration needed."

