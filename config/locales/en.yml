# English strings. Spanish lives in es.yml with the same keys.
#
# - Views:   <%= t("locale_picker.label") %>
# - JS:      everything under `js:` is sent to the page; import { t } from "controllers/shared/i18n"
#
# YAML reads yes/no/on/off as booleans, so quote them when they are text.
en:
  locale_picker:
    label: "Language"
    submit: "Change"

  # Strings for the Stimulus controllers (see LocaleHelper#js_translations_tag).
  js: {}
