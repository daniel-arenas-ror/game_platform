# English strings. Spanish lives in es.yml with the same keys.
#
# - Views use lazy keys: t(".title") in app/views/home/index.html.erb reads en.home.index.title.
# - JS:    everything under `js:` is sent to the page; import { t } from "controllers/shared/i18n"
# - Long prose pages (about, privacy, contact) are whole templates per language: about.es.html.erb.
#
# YAML reads yes/no/on/off as booleans, so quote them when they are text.
en:
  seo:
    default_title: "%{site} – Free Party Games You Play From Your Phone"
    default_description: >-
      Free multiplayer party games for groups. Put the host screen on your TV, friends join by
      scanning a QR code and play from their phones — no app, no sign-up.
