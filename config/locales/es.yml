      any_room_text: "Cada uno tiene su propio control, así que nadie espera turno y nadie se queda solo mirando."
      use_cases:
        classroom:
          label: "Salones de clase"
          headline: "Una pausa activa que funciona."
          body: "Despierta a la clase entre lecciones. Todos los estudiantes juegan a la vez desde su celular, y la pantalla grande mantiene unido al grupo."
        work:
          label: "Equipos de trabajo"
          headline: "Anima cualquier reunión."
          body: "Empieza con cinco minutos de juego. La gente se relaja, habla más y se conoce mejor — en la oficina o en una videollamada."
        family:
          label: "Familia y amigos"
          headline: "Tiempo de calidad frente a la TV."
          body: "De los niños a los abuelos, todos están en el mismo juego. Sin controles que compartir y nada que instalar."
      try: "Prueba:"
      why_title: "Más que un juego"
      why_text: "Unas cuantas rondas juntos cambian el ambiente de un lugar. Esto es lo que la gente gana."
      benefits:
        - title: "Tómate un respiro del estrés"
          body: "Reírse juntos es la forma más rápida de recargarse después de un día largo o una reunión pesada."
        - title: "Despierta tu cerebro"
          body: "Memoria, concentración y agilidad mental — cada juego pone tu cabeza a trabajar."
        - title: "Fomenta el trabajo en equipo"
          body: "Algunos juegos premian pensar igual, otros te hacen leer a la gente que te rodea."
        - title: "Conoce a tu equipo"
          body: "Descubre cómo piensan tus compañeros cuando no hay una agenda sobre la mesa."
        - title: "Tiempo de calidad en familia"
          body: "Los celulares se vuelven controles, así que todos están en el mismo juego, juntos."
      simple_title: "Nada que instalar. Juega donde se reúnan."
      same_room_title: "En el mismo lugar"
      same_room_text: "Abre un juego en una TV, un proyector o un portátil. Todos escanean el código QR con la cámara del celular y listo."
      video_call_title: "En una videollamada"
      video_call_text_html: >-
        Comparte tu pantalla en Zoom, Google Meet o Microsoft Teams. Los jugadores escanean el código desde la llamada — o lo
        escriben en %{join_link} — y empiezan a jugar.
      video_call_note: "Los juegos de reacción rápida se disfrutan más en el mismo lugar."
      how_title: "Cómo funciona"
      steps:
        - title: "Elige un juego"
          body: "La pantalla principal muestra un código de sala y un código QR. Ponla en la pantalla más grande que tengas, o compártela en tu llamada."
        - title: "Únete desde tu celular"
          body: "Los jugadores escanean el código QR o escriben el código de sala, eligen un apodo y listo."
        - title: "Jueguen juntos"
          body: "Trivia, deducción social, memoria, colores y más — %{count} juegos, todos jugando en vivo."
      ready_title: "Listo cuando tu grupo lo esté."
      ready_text: "Abre una sala en segundos. Sin registro."

