  home:
    index:
      hero_title: "Dale un toque divertido a cualquier reunión."
      hero_text: >-
        Juegos de fiesta gratis para salones de clase, equipos de trabajo y reuniones familiares.
        Pon una pantalla donde todos la vean — los jugadores se unen desde su celular en segundos.
      start_game: "Empezar un juego"
      join_game: "Unirse a un juego"
      hero_figure: "La pantalla principal muestra un código de sala y un código QR; los jugadores se unen desde su celular."
